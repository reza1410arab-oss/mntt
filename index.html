<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 GENERATOR GAME ARAP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            background: #111;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: min(100% - 30px, 1100px);
            margin: 0 auto;
            padding: 30px 0 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 30px;
            line-height: 1.2;
        }

        .header p {
            margin: 0;
            color: #aaa;
            font-size: 15px;
        }

        #gameContainer {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
            gap: 18px;
        }

        .game-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
        }

        .game-card h2 {
            margin: 0 0 15px;
            font-size: 20px;
            line-height: 1.3;
        }

        .nomor {
            display: inline-block;
            margin-bottom: 10px;
            color: #888;
            font-size: 13px;
            font-weight: bold;
        }

        .saran {
            color: #eee;
            line-height: 1.6;
            word-break: break-word;
        }

        .pola {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            color: #aaa;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .app {
                width: min(100% - 20px, 1100px);
                padding-top: 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            #gameContainer {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .game-card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>🎮 GENERATOR GAME ARAP</h1>
            <p>Daftar game</p>
        </header>

        <section id="gameContainer"></section>

    </main>

    <script src="./script.js"></script>

</body>
</html>
