<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎮 GENERATOR GAME ARAP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .app {
            width: min(100% - 30px, 1100px);
            margin: 0 auto;
            padding: 30px 0 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #aaa;
        }

        #gameContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .game-card {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
        }

        .game-card h2 {
            margin: 0 0 15px;
            font-size: 20px;
        }

        .saran {
            white-space: normal;
            line-height: 1.6;
            color: #eee;
        }

        .pola {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            color: #aaa;
            line-height: 1.5;
        }

        .nomor {
            display: inline-block;
            margin-bottom: 10px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="app">

        <header class="header">
            <h1>🎮 GENERATOR GAME ARAP</h1>
            <p>Daftar game</p>
        </header>

        <section id="gameContainer"></section>

    </main>

    <script src="./script.js"></script>

</body>
</html>
